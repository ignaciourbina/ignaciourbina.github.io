<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exponential and logarithmic functions</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'y=e^{x}',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'y=x',
		color: '#c74440',
		lineStyle: 'DASHED',
		lineWidth: 3,
		id: '1',
	});
	calculator.setExpression({
		latex: 'y=\\ln\\left(x\\right)',
		color: '#388c46',
		lineWidth: 3,
		id: '2',
	});
	calculator.setExpression({
		latex: 'k=1',
		sliderBounds: {
			min: '0.2',
			max: '4',
			step: '0.05',
		},
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(k,e^{k}\\right)',
		color: '#2d70b3',
		pointSize: 12,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\left(e^{k},k\\right)',
		color: '#388c46',
		pointSize: 12,
		id: '5',
	});
	calculator.setMathBounds({ left: -1, right: 4, bottom: -8, top: 8 });
</script>
</body>
</html>
