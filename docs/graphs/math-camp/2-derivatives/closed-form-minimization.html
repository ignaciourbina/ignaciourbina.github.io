<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closed-form minimization of f(x) = (3x − 2)²</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f\\left(x\\right)=\\left(3 x - 2\\right)^{2}',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: "f'\\left(x\\right)",
		color: '#388c46',
		lineStyle: 'DASHED',
		id: '1',
	});
	calculator.setExpression({
		latex: 'a=1.5',
		sliderBounds: {
			min: '-0.5',
			max: '2',
			step: '0.01',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: "y=f'\\left(a\\right)\\left(x-a\\right)+f\\left(a\\right)",
		color: '#fa7e19',
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(a,f\\left(a\\right)\\right)',
		color: '#fa7e19',
		pointSize: 8,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\left(\\frac{2}{3},0\\right)',
		color: '#c74440',
		pointSize: 9,
		label: 'x* = 2/3',
		showLabel: true,
		id: '5',
	});
	calculator.setMathBounds({ left: -1, right: 2.5, bottom: -6, top: 16 });
</script>
</body>
</html>
