<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newton–Raphson root finding for f′(x) = x eˣ − 16</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'g\\left(x\\right)=\\left(x - 1\\right) e^{x} + e^{x} - 16',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'X_{s}=\\left[3.000000,3.000000,2.449148,2.449148,2.139717,2.139717,2.057956,2.057956,2.053208,2.053208,2.053193\\right]',
		hidden: true,
		id: '1',
	});
	calculator.setExpression({
		latex: 'Y_{s}=\\left[0.000000,44.256611,0.000000,12.357416,0.000000,2.181245,0.000000,0.113688,0.000000,0.000357,0.000000\\right]',
		hidden: true,
		id: '2',
	});
	calculator.setExpression({
		latex: 's=1',
		sliderBounds: {
			min: '1',
			max: '5',
			step: '1',
		},
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(X_{s}\\left[1...2s+1\\right],Y_{s}\\left[1...2s+1\\right]\\right)',
		color: '#388c46',
		lines: true,
		points: false,
		lineWidth: 2,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\left(X_{s}\\left[1...2s+1\\right],0\\right)',
		color: '#fa7e19',
		pointSize: 8,
		id: '5',
	});
	calculator.setExpression({
		latex: '\\left(2.053193,0\\right)',
		color: '#c74440',
		pointSize: 9,
		label: 'x* = W(16) ≈ 2.0532',
		showLabel: true,
		id: '6',
	});
	calculator.setMathBounds({ left: -0.5, right: 4, bottom: -25, top: 55 });
</script>
</body>
</html>
