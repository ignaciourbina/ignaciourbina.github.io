<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The limit of a function</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f\\left(x\\right)=x^{3} - 3 x^{2} + 2 x + 5',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'c=1',
		sliderBounds: {
			min: '-2',
			max: '2.5',
			step: '0.05',
		},
		id: '1',
	});
	calculator.setExpression({
		latex: 'L=f\\left(c\\right)',
		id: '2',
	});
	calculator.setExpression({
		latex: 'x=c',
		color: '#c74440',
		lineStyle: 'DASHED',
		id: '3',
	});
	calculator.setExpression({
		latex: 'y=L',
		color: '#c74440',
		lineStyle: 'DASHED',
		id: '4',
	});
	calculator.setExpression({
		latex: '\\left(c,L\\right)',
		color: '#c74440',
		pointSize: 14,
		label: '(c, L)',
		showLabel: true,
		id: '5',
	});
	calculator.setMathBounds({ left: -2.5, right: 3, bottom: -8, top: 14 });
</script>
</body>
</html>
