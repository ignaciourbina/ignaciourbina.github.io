<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riemann rectangles under the triangular PDF</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f\\left(x\\right)=\\left\\{0\\le x\\le2:\\frac{x}{2},0\\right\\}',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'n=10',
		sliderBounds: {
			min: '1',
			max: '100',
			step: '1',
		},
		id: '1',
	});
	calculator.setExpression({
		latex: 'd=\\frac{1}{n}',
		hidden: true,
		id: '2',
	});
	calculator.setExpression({
		latex: 'X_{k}=0.5+d\\cdot\\left[0...n-1\\right]',
		hidden: true,
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left[\\operatorname{polygon}\\left(\\left(a,0\\right),\\left(a+d,0\\right),\\left(a+d,f\\left(a\\right)\\right),\\left(a,f\\left(a\\right)\\right)\\right)\\operatorname{for}a=X_{k}\\right]',
		color: '#fa7e19',
		fillOpacity: 0.3,
		id: '4',
	});
	calculator.setExpression({
		latex: 'S=\\operatorname{total}\\left(f\\left(X_{k}\\right)d\\right)',
		hidden: true,
		id: '5',
	});
	calculator.setExpression({
		latex: '\\left(0.55,1.05\\right)',
		color: '#000000',
		pointSize: 0,
		label: 'left Riemann sum = ${S} → exact 0.5',
		showLabel: true,
		id: '6',
	});
	calculator.setMathBounds({ left: -0.3, right: 2.3, bottom: -0.2, top: 1.25 });
</script>
</body>
</html>
