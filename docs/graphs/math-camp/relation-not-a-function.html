<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A relation that is not a function: y^2 = 5x</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'y^{2}=5x',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'a=2',
		sliderBounds: {
			min: '0',
			max: '5',
			step: '0.1',
		},
		id: '1',
	});
	calculator.setExpression({
		latex: 'x=a',
		color: '#c74440',
		lineStyle: 'DASHED',
		id: '2',
	});
	calculator.setExpression({
		latex: '\\left(a,\\sqrt{5a}\\right)',
		color: '#c74440',
		pointSize: 12,
		label: '(a, +sqrt(5a))',
		showLabel: true,
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(a,-\\sqrt{5a}\\right)',
		color: '#c74440',
		pointSize: 12,
		label: '(a, -sqrt(5a))',
		showLabel: true,
		id: '4',
	});
	calculator.setMathBounds({ left: -1, right: 6, bottom: -6, top: 6 });
</script>
</body>
</html>
