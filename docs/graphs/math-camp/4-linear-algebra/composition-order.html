<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order matters: RS against SR</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'k=2',
		sliderBounds: {
			min: '0.5',
			max: '3',
			step: '0.05',
		},
		id: '0',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(1,0\\right),\\left(1,1\\right),\\left(0,1\\right)\\right)',
		color: '#000000',
		lineWidth: 2,
		fillOpacity: 0.06,
		id: '1',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(0,k\\right),\\left(-1,k\\right),\\left(-1,0\\right)\\right)',
		color: '#2d70b3',
		lineWidth: 2.5,
		fillOpacity: 0.2,
		id: '2',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(0,1\\right),\\left(-k,1\\right),\\left(-k,0\\right)\\right)',
		color: '#fa7e19',
		lineWidth: 2.5,
		fillOpacity: 0.2,
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(-0.5,k\\right)',
		color: '#2d70b3',
		pointSize: 1,
		label: 'RS: stretch, then rotate',
		showLabel: true,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\left(-k,0.5\\right)',
		color: '#fa7e19',
		pointSize: 1,
		label: 'SR: rotate, then stretch',
		showLabel: true,
		id: '5',
	});
	calculator.setExpression({
		latex: '\\left(0.4,3.4\\right)',
		color: '#000000',
		pointSize: 1,
		label: 'k = ${k}: the two agree only at k = 1',
		showLabel: true,
		id: '6',
	});
	calculator.setMathBounds({ left: -3.6, right: 3.6, bottom: -1.2, top: 3.6 });
</script>
</body>
</html>
