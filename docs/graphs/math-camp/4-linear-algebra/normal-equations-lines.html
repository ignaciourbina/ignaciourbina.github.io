<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The normal equations as two lines, and the determinant</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'A=10',
		sliderBounds: {
			min: '2',
			max: '46',
			step: '0.1',
		},
		id: '0',
	});
	calculator.setExpression({
		latex: 'B=46',
		sliderBounds: {
			min: '2',
			max: '46',
			step: '0.1',
		},
		id: '1',
	});
	calculator.setExpression({
		latex: 'C=428',
		sliderBounds: {
			min: '200',
			max: '700',
			step: '1',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: 'y=50-x',
		color: '#2d70b3',
		lineWidth: 3,
		id: '3',
	});
	calculator.setExpression({
		latex: 'y=\\frac{C-Bx}{A}',
		color: '#fa7e19',
		lineWidth: 3,
		id: '4',
	});
	calculator.setExpression({
		latex: 'D=10B-10A',
		id: '5',
	});
	calculator.setExpression({
		latex: 'a_{1}=\\frac{500B-10C}{D}',
		id: '6',
	});
	calculator.setExpression({
		latex: 'b_{1}=\\frac{10C-500A}{D}',
		id: '7',
	});
	calculator.setExpression({
		latex: '\\left(b_{1},a_{1}\\right)',
		color: '#c74440',
		pointSize: 12,
		label: '(${b_1}, ${a_1})',
		showLabel: true,
		id: '8',
	});
	calculator.setExpression({
		latex: '\\left(-4.6,64\\right)',
		color: '#000000',
		pointSize: 1,
		label: '10a + 10b = 500   and   ${A}a + ${B}b = ${C}',
		showLabel: true,
		id: '9',
	});
	calculator.setExpression({
		latex: '\\left(-4.6,61.5\\right)',
		color: '#000000',
		pointSize: 1,
		label: 'det = ${D}  (zero when A = B: parallel or identical)',
		showLabel: true,
		id: '10',
	});
	calculator.setMathBounds({ left: -5, right: 2, bottom: 38, top: 66 });
</script>
</body>
</html>
