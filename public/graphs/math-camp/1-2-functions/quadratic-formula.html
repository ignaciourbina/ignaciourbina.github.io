<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The quadratic formula</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'a=1',
		sliderBounds: {
			min: '-3',
			max: '3',
			step: '0.1',
		},
		id: '0',
	});
	calculator.setExpression({
		latex: 'b=3',
		sliderBounds: {
			min: '-6',
			max: '6',
			step: '0.1',
		},
		id: '1',
	});
	calculator.setExpression({
		latex: 'c=-4',
		sliderBounds: {
			min: '-10',
			max: '10',
			step: '0.1',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: 'y=ax^{2}+bx+c',
		color: '#2d70b3',
		lineWidth: 3,
		id: '3',
	});
	calculator.setExpression({
		latex: 'D=b^{2}-4ac',
		id: '4',
	});
	calculator.setExpression({
		latex: 'r_{1}=\\frac{-b+\\sqrt{D}}{2a}',
		id: '5',
	});
	calculator.setExpression({
		latex: 'r_{2}=\\frac{-b-\\sqrt{D}}{2a}',
		id: '6',
	});
	calculator.setExpression({
		latex: '\\left(r_{1},0\\right)',
		color: '#c74440',
		pointSize: 14,
		id: '7',
	});
	calculator.setExpression({
		latex: '\\left(r_{2},0\\right)',
		color: '#c74440',
		pointSize: 14,
		id: '8',
	});
	calculator.setMathBounds({ left: -8, right: 6, bottom: -10, top: 12 });
</script>
</body>
</html>
