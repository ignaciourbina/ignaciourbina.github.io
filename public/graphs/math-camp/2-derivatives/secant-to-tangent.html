<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secant to tangent on f(x) = x²</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f\\left(x\\right)=x^{2}',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'a=1',
		sliderBounds: {
			min: '-2',
			max: '2',
			step: '0.05',
		},
		id: '1',
	});
	calculator.setExpression({
		latex: 'b=2.5',
		sliderBounds: {
			min: '-2.5',
			max: '3',
			step: '0.01',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: 'm=\\frac{f\\left(b\\right)-f\\left(a\\right)}{b-a}',
		hidden: true,
		id: '3',
	});
	calculator.setExpression({
		latex: 'y=m\\left(x-a\\right)+f\\left(a\\right)',
		color: '#fa7e19',
		lineWidth: 2,
		id: '4',
	});
	calculator.setExpression({
		latex: 'y=2a\\left(x-a\\right)+f\\left(a\\right)',
		color: '#388c46',
		lineStyle: 'DASHED',
		id: '5',
	});
	calculator.setExpression({
		latex: '\\left(a,f\\left(a\\right)\\right)',
		color: '#2d70b3',
		pointSize: 8,
		id: '6',
	});
	calculator.setExpression({
		latex: '\\left(b,f\\left(b\\right)\\right)',
		color: '#fa7e19',
		pointSize: 8,
		id: '7',
	});
	calculator.setExpression({
		latex: '\\left(a,-0.6\\right)',
		color: '#000000',
		pointSize: 0,
		label: 'slope of secant: ${m}',
		showLabel: true,
		id: '8',
	});
	calculator.setMathBounds({ left: -3, right: 3.5, bottom: -2, top: 9 });
</script>
</body>
</html>
