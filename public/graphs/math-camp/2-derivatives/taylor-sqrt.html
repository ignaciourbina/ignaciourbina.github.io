<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taylor approximation of √x around a = 1</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f\\left(x\\right)=\\sqrt{x}',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'n=1',
		sliderBounds: {
			min: '0',
			max: '3',
			step: '1',
		},
		id: '1',
	});
	calculator.setExpression({
		latex: 'y=1\\left\\{n=0\\right\\}',
		color: '#fa7e19',
		lineWidth: 2,
		id: '2',
	});
	calculator.setExpression({
		latex: 'y=\\frac{x}{2} + \\frac{1}{2}\\left\\{n=1\\right\\}',
		color: '#fa7e19',
		lineWidth: 2,
		id: '3',
	});
	calculator.setExpression({
		latex: 'y=- \\frac{x^{2}}{8} + \\frac{3 x}{4} + \\frac{3}{8}\\left\\{n=2\\right\\}',
		color: '#fa7e19',
		lineWidth: 2,
		id: '4',
	});
	calculator.setExpression({
		latex: 'y=\\frac{x^{3}}{16} - \\frac{5 x^{2}}{16} + \\frac{15 x}{16} + \\frac{5}{16}\\left\\{n=3\\right\\}',
		color: '#fa7e19',
		lineWidth: 2,
		id: '5',
	});
	calculator.setExpression({
		latex: '\\left(2,\\sqrt{2}\\right)',
		color: '#c74440',
		pointSize: 9,
		label: '√2 ≈ 1.4142',
		showLabel: true,
		id: '6',
	});
	calculator.setExpression({
		latex: '\\left(1,1\\right)',
		color: '#000000',
		pointSize: 8,
		label: 'expansion point a = 1',
		showLabel: true,
		id: '7',
	});
	calculator.setMathBounds({ left: -0.5, right: 4.5, bottom: -0.5, top: 2.5 });
</script>
</body>
</html>
