<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mean value theorem on [0, 4]</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f\\left(x\\right)=x^{3} - 3 x^{2} + 7\\left\\{0\\le x\\le4\\right\\}',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'y=4x+7\\left\\{0\\le x\\le4\\right\\}',
		color: '#fa7e19',
		lineWidth: 2,
		id: '1',
	});
	calculator.setExpression({
		latex: 'a=1',
		sliderBounds: {
			min: '0',
			max: '4',
			step: '0.01',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: "y=f'\\left(a\\right)\\left(x-a\\right)+f\\left(a\\right)",
		color: '#388c46',
		lineStyle: 'DASHED',
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(a,f\\left(a\\right)\\right)',
		color: '#388c46',
		pointSize: 8,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\left(2.527525,f\\left(2.527525\\right)\\right)',
		color: '#c74440',
		pointSize: 9,
		label: 'c = (3 + √21)/3 ≈ 2.5275',
		showLabel: true,
		id: '5',
	});
	calculator.setMathBounds({ left: -0.5, right: 4.5, bottom: -4, top: 26 });
</script>
</body>
</html>
