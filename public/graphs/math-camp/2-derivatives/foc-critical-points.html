<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-order condition on f(x) = x³ − 3x² + 7</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f\\left(x\\right)=x^{3} - 3 x^{2} + 7',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: "f'\\left(x\\right)",
		color: '#388c46',
		lineStyle: 'DASHED',
		id: '1',
	});
	calculator.setExpression({
		latex: 'a=-1',
		sliderBounds: {
			min: '-1.5',
			max: '3.5',
			step: '0.01',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: "y=f'\\left(a\\right)\\left(x-a\\right)+f\\left(a\\right)",
		color: '#fa7e19',
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(a,f\\left(a\\right)\\right)',
		color: '#fa7e19',
		pointSize: 8,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\left(0,7\\right)',
		color: '#c74440',
		pointSize: 9,
		label: 'local max (0, 7)',
		showLabel: true,
		id: '5',
	});
	calculator.setExpression({
		latex: '\\left(2,3\\right)',
		color: '#388c46',
		pointSize: 9,
		label: 'local min (2, 3)',
		showLabel: true,
		id: '6',
	});
	calculator.setMathBounds({ left: -1.8, right: 4, bottom: -6, top: 14 });
</script>
</body>
</html>
