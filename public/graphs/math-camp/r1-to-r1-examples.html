<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Functions from R to R</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'y=x + 1',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'y=2 x + 3',
		color: '#388c46',
		lineWidth: 3,
		id: '1',
	});
	calculator.setExpression({
		latex: 'y=x^{2} - 4 x + 4',
		color: '#c74440',
		lineWidth: 3,
		id: '2',
	});
	calculator.setExpression({
		latex: 'y=\\sin\\left(x\\right)',
		color: '#6042a6',
		lineWidth: 3,
		id: '3',
	});
	calculator.setExpression({
		latex: 'y=e^{x}',
		color: '#000000',
		lineWidth: 3,
		id: '4',
	});
	calculator.setMathBounds({ left: -6, right: 6, bottom: -6, top: 12 });
</script>
</body>
</html>
