<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The exponential distribution and its CDF</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'L=1',
		sliderBounds: {
			min: '0.2',
			max: '3',
			step: '0.05',
		},
		id: '0',
	});
	calculator.setExpression({
		latex: 'f\\left(x\\right)=\\left\\{x\\ge0:Le^{-Lx},0\\right\\}',
		color: '#2d70b3',
		lineWidth: 3,
		id: '1',
	});
	calculator.setExpression({
		latex: 'a=1',
		sliderBounds: {
			min: '0',
			max: '5',
			step: '0.01',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: '0\\le y\\le f\\left(x\\right)\\left\\{0\\le x\\le a\\right\\}',
		color: '#fa7e19',
		fillOpacity: 0.4,
		id: '3',
	});
	calculator.setExpression({
		latex: 'P=1-e^{-La}',
		hidden: true,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\left(2.6,1.35\\right)',
		color: '#000000',
		pointSize: 0,
		label: 'P(X ≤ a) = 1 − e^(−λa) = ${P}',
		showLabel: true,
		id: '5',
	});
	calculator.setMathBounds({ left: -0.5, right: 5.5, bottom: -0.2, top: 1.6 });
</script>
</body>
</html>
