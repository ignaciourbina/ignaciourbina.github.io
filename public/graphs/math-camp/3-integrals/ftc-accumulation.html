<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accumulated area is the antiderivative</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f\\left(x\\right)=\\left\\{0\\le x\\le2:\\frac{x}{2},0\\right\\}',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'a=1.2',
		sliderBounds: {
			min: '0',
			max: '2',
			step: '0.01',
		},
		id: '1',
	});
	calculator.setExpression({
		latex: '0\\le y\\le f\\left(x\\right)\\left\\{0\\le x\\le a\\right\\}',
		color: '#fa7e19',
		fillOpacity: 0.4,
		id: '2',
	});
	calculator.setExpression({
		latex: 'F\\left(x\\right)=\\frac{x^{2}}{4}\\left\\{0\\le x\\le2\\right\\}',
		color: '#388c46',
		lineWidth: 2,
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(a,F\\left(a\\right)\\right)',
		color: '#388c46',
		pointSize: 9,
		label: 'F(a) = shaded area',
		showLabel: true,
		id: '4',
	});
	calculator.setMathBounds({ left: -0.3, right: 2.3, bottom: -0.2, top: 1.25 });
</script>
</body>
</html>
