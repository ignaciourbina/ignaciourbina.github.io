<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probability as area: the uniform distribution</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f\\left(x\\right)=\\left\\{0\\le x\\le1:1,0\\right\\}',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'a=0.75',
		sliderBounds: {
			min: '0',
			max: '1',
			step: '0.01',
		},
		id: '1',
	});
	calculator.setExpression({
		latex: '0\\le y\\le1\\left\\{a\\le x\\le1\\right\\}',
		color: '#fa7e19',
		fillOpacity: 0.4,
		id: '2',
	});
	calculator.setExpression({
		latex: 'P=1-a',
		hidden: true,
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(0.5,1.12\\right)',
		color: '#000000',
		pointSize: 0,
		label: 'P(X > a) = 1 − a = ${P}',
		showLabel: true,
		id: '4',
	});
	calculator.setMathBounds({ left: -0.3, right: 1.5, bottom: -0.2, top: 1.3 });
</script>
</body>
</html>
