<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A 2x2 matrix acting on the unit square</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'm=2',
		sliderBounds: {
			min: '-3',
			max: '3',
			step: '0.1',
		},
		id: '0',
	});
	calculator.setExpression({
		latex: 'n=1',
		sliderBounds: {
			min: '-3',
			max: '3',
			step: '0.1',
		},
		id: '1',
	});
	calculator.setExpression({
		latex: 'o=0',
		sliderBounds: {
			min: '-3',
			max: '3',
			step: '0.1',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: 'p=1',
		sliderBounds: {
			min: '-3',
			max: '3',
			step: '0.1',
		},
		id: '3',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(1,0\\right),\\left(1,1\\right),\\left(0,1\\right)\\right)',
		color: '#2d70b3',
		lineWidth: 2,
		fillOpacity: 0.08,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(m,o\\right),\\left(m+n,o+p\\right),\\left(n,p\\right)\\right)',
		color: '#fa7e19',
		lineWidth: 2.5,
		fillOpacity: 0.25,
		id: '5',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(1,0\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		lineStyle: 'DASHED',
		id: '6',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(0,1\\right)\\right)',
		color: '#6042a6',
		lineWidth: 2,
		lineStyle: 'DASHED',
		id: '7',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(m,o\\right)\\right)',
		color: '#c74440',
		lineWidth: 3,
		id: '8',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(n,p\\right)\\right)',
		color: '#6042a6',
		lineWidth: 3,
		id: '9',
	});
	calculator.setExpression({
		latex: '\\left(m,o\\right)',
		color: '#c74440',
		pointSize: 10,
		label: 'Ae1 = (${m}, ${o}) = column 1',
		showLabel: true,
		id: '10',
	});
	calculator.setExpression({
		latex: '\\left(n,p\\right)',
		color: '#6042a6',
		pointSize: 10,
		label: 'Ae2 = (${n}, ${p}) = column 2',
		showLabel: true,
		id: '11',
	});
	calculator.setExpression({
		latex: 'D=mp-no',
		id: '12',
	});
	calculator.setExpression({
		latex: '\\left(-3.6,3.4\\right)',
		color: '#000000',
		pointSize: 1,
		label: 'det = ${D}  = signed area of the image',
		showLabel: true,
		id: '13',
	});
	calculator.setMathBounds({ left: -3.8, right: 3.8, bottom: -2.6, top: 3.6 });
</script>
</body>
</html>
