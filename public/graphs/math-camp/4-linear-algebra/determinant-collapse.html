<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The determinant as area, and where it vanishes</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 's=1',
		sliderBounds: {
			min: '-1',
			max: '5',
			step: '0.05',
		},
		id: '0',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(2,1\\right),\\left(2+s,3\\right),\\left(s,2\\right)\\right)',
		color: '#fa7e19',
		lineWidth: 2.5,
		fillOpacity: 0.25,
		id: '1',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(2,1\\right)\\right)',
		color: '#c74440',
		lineWidth: 3,
		id: '2',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(s,2\\right)\\right)',
		color: '#6042a6',
		lineWidth: 3,
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(2,1\\right)',
		color: '#c74440',
		pointSize: 10,
		label: 'column 1 = (2, 1)',
		showLabel: true,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\left(s,2\\right)',
		color: '#6042a6',
		pointSize: 10,
		label: 'column 2 = (${s}, 2)',
		showLabel: true,
		id: '5',
	});
	calculator.setExpression({
		latex: 'y=\\frac{x}{2}',
		color: '#000000',
		lineStyle: 'DASHED',
		lineWidth: 1.5,
		id: '6',
	});
	calculator.setExpression({
		latex: 'D=4-s',
		id: '7',
	});
	calculator.setExpression({
		latex: '\\left(-1.4,4.6\\right)',
		color: '#000000',
		pointSize: 1,
		label: 'det = ${D} = area',
		showLabel: true,
		id: '8',
	});
	calculator.setExpression({
		latex: '\\left(-1.4,4.1\\right)',
		color: '#000000',
		pointSize: 1,
		label: 'at s = 4 the area is 0: singular, rank 1, span is the dashed line',
		showLabel: true,
		id: '9',
	});
	calculator.setMathBounds({ left: -1.6, right: 6.4, bottom: -1, top: 4.8 });
</script>
</body>
</html>
