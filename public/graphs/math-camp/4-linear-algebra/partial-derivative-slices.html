<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freeze a, and SSR is a parabola in b</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'X_{1}=\\left[-2,-1,-1,0,1,1,2,3,3,4\\right]',
		hidden: true,
		id: '0',
	});
	calculator.setExpression({
		latex: 'Y_{1}=\\left[55,55,53,53,52,48,49,45,47,43\\right]',
		hidden: true,
		id: '1',
	});
	calculator.setExpression({
		latex: 'a=56',
		sliderBounds: {
			min: '44',
			max: '62',
			step: '0.01',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: 'S_{a}\\left(u\\right)=\\operatorname{total}\\left(\\left(Y_{1}-\\left(a+uX_{1}\\right)\\right)^{2}\\right)',
		id: '3',
	});
	calculator.setExpression({
		latex: 'y=S_{a}\\left(x\\right)',
		color: '#2d70b3',
		lineWidth: 3,
		id: '4',
	});
	calculator.setExpression({
		latex: 'b_{a}=\\frac{428-10a}{46}',
		id: '5',
	});
	calculator.setExpression({
		latex: 'S_{v}=S_{a}\\left(b_{a}\\right)',
		id: '6',
	});
	calculator.setExpression({
		latex: '\\left(b_{a},S_{v}\\right)',
		color: '#fa7e19',
		pointSize: 12,
		label: 'vertex: b = ${b_a}, SSR = ${S_v}',
		showLabel: true,
		id: '7',
	});
	calculator.setExpression({
		latex: 'y=16',
		color: '#388c46',
		lineStyle: 'DASHED',
		lineWidth: 2,
		id: '8',
	});
	calculator.setExpression({
		latex: '\\left(-5.4,26\\right)',
		color: '#388c46',
		pointSize: 1,
		label: 'floor SSR = 16, reached only at a = 52',
		showLabel: true,
		id: '9',
	});
	calculator.setMathBounds({ left: -6, right: 2, bottom: -20, top: 420 });
</script>
</body>
</html>
