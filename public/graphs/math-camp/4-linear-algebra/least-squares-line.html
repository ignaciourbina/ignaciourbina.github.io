<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Least squares: choose the line, watch the SSR</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'X_{1}=\\left[-2,-1,-1,0,1,1,2,3,3,4\\right]',
		hidden: true,
		id: '0',
	});
	calculator.setExpression({
		latex: 'Y_{1}=\\left[55,55,53,53,52,48,49,45,47,43\\right]',
		hidden: true,
		id: '1',
	});
	calculator.setExpression({
		latex: 'a=55',
		sliderBounds: {
			min: '40',
			max: '65',
			step: '0.01',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: 'b=0',
		sliderBounds: {
			min: '-6',
			max: '2',
			step: '0.01',
		},
		id: '3',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(-2,55\\right),\\left(-2,a+b\\cdot\\left(-2\\right)\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(-1,55\\right),\\left(-1,a+b\\cdot\\left(-1\\right)\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		id: '5',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(-1,53\\right),\\left(-1,a+b\\cdot\\left(-1\\right)\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		id: '6',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(0,53\\right),\\left(0,a+b\\cdot\\left(0\\right)\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		id: '7',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(1,52\\right),\\left(1,a+b\\cdot\\left(1\\right)\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		id: '8',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(1,48\\right),\\left(1,a+b\\cdot\\left(1\\right)\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		id: '9',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(2,49\\right),\\left(2,a+b\\cdot\\left(2\\right)\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		id: '10',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(3,45\\right),\\left(3,a+b\\cdot\\left(3\\right)\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		id: '11',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(3,47\\right),\\left(3,a+b\\cdot\\left(3\\right)\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		id: '12',
	});
	calculator.setExpression({
		latex: '\\operatorname{polygon}\\left(\\left(4,43\\right),\\left(4,a+b\\cdot\\left(4\\right)\\right)\\right)',
		color: '#c74440',
		lineWidth: 2,
		id: '13',
	});
	calculator.setExpression({
		latex: 'y=a+bx',
		color: '#fa7e19',
		lineWidth: 3,
		id: '14',
	});
	calculator.setExpression({
		latex: '\\left(X_{1},Y_{1}\\right)',
		color: '#2d70b3',
		pointSize: 10,
		id: '15',
	});
	calculator.setExpression({
		latex: 'S=\\operatorname{total}\\left(\\left(Y_{1}-\\left(a+bX_{1}\\right)\\right)^{2}\\right)',
		id: '16',
	});
	calculator.setExpression({
		latex: '\\left(-3,58\\right)',
		color: '#000000',
		pointSize: 1,
		label: 'SSR = ${S}',
		showLabel: true,
		id: '17',
	});
	calculator.setExpression({
		latex: '\\left(-3,56.4\\right)',
		color: '#388c46',
		pointSize: 1,
		label: 'best possible: 16, at a = 52, b = -2',
		showLabel: true,
		id: '18',
	});
	calculator.setMathBounds({ left: -3.6, right: 5.6, bottom: 39, top: 60 });
</script>
</body>
</html>
