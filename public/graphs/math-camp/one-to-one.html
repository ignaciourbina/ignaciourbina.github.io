<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Many-to-one vs one-to-one</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f(x)=x^{2}',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'g(x)=2 x + 4',
		color: '#388c46',
		lineWidth: 3,
		id: '1',
	});
	calculator.setExpression({
		latex: 'c=4',
		sliderBounds: {
			min: '-2',
			max: '10',
			step: '0.1',
		},
		id: '2',
	});
	calculator.setExpression({
		latex: 'y=c',
		color: '#c74440',
		lineStyle: 'DASHED',
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(\\sqrt{c},c\\right)',
		color: '#2d70b3',
		pointSize: 12,
		id: '4',
	});
	calculator.setExpression({
		latex: '\\left(-\\sqrt{c},c\\right)',
		color: '#2d70b3',
		pointSize: 12,
		id: '5',
	});
	calculator.setExpression({
		latex: '\\left(\\frac{c-4}{2},c\\right)',
		color: '#388c46',
		pointSize: 12,
		id: '6',
	});
	calculator.setMathBounds({ left: -6, right: 6, bottom: -4, top: 12 });
</script>
</body>
</html>
