<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometric series and their partial sums</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'a=1',
		sliderBounds: {
			min: '-3',
			max: '3',
			step: '0.1',
		},
		id: '0',
	});
	calculator.setExpression({
		latex: 'r=0.5',
		sliderBounds: {
			min: '-1.4',
			max: '1.4',
			step: '0.05',
		},
		hidden: true,
		id: '1',
	});
	calculator.setExpression({
		latex: 'S\\left(m\\right)=\\frac{a\\left(1-r^{m}\\right)}{1-r}',
		hidden: true,
		id: '2',
	});
	calculator.setExpression({
		latex: 'm_{1}=\\left[1...20\\right]',
		hidden: true,
		id: '3',
	});
	calculator.setExpression({
		latex: '\\left(m_{1},S\\left(m_{1}\\right)\\right)',
		color: '#2d70b3',
		pointSize: 9,
		id: '4',
	});
	calculator.setExpression({
		latex: 'y=\\frac{a}{1-r}',
		color: '#c74440',
		lineStyle: 'DASHED',
		label: 'a/(1-r)',
		showLabel: true,
		id: '5',
	});
	calculator.setMathBounds({ left: 0, right: 20, bottom: -4, top: 6 });
</script>
</body>
</html>
