<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continuity of the absolute value function</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'y=\\left|x\\right|',
		color: '#2d70b3',
		lineWidth: 4,
		id: '0',
	});
	calculator.setExpression({
		latex: 'y=-x\\left\\{x<0\\right\\}',
		color: '#388c46',
		lineStyle: 'DASHED',
		id: '1',
	});
	calculator.setExpression({
		latex: 'y=x\\left\\{x\\ge0\\right\\}',
		color: '#c74440',
		lineStyle: 'DASHED',
		id: '2',
	});
	calculator.setExpression({
		latex: '\\left(0,0\\right)',
		color: '#000000',
		pointSize: 12,
		label: 'f(0) = 0',
		showLabel: true,
		id: '3',
	});
	calculator.setMathBounds({ left: -3, right: 3, bottom: -1, top: 3 });
</script>
</body>
</html>
