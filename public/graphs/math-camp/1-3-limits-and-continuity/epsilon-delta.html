<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The delta-epsilon definition of a limit</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'f\\left(x\\right)=3 x - 5',
		color: '#2d70b3',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'c=2',
		id: '1',
	});
	calculator.setExpression({
		latex: 'L=f\\left(c\\right)',
		id: '2',
	});
	calculator.setExpression({
		latex: '\\epsilon=0.6',
		sliderBounds: {
			min: '0.05',
			max: '2',
			step: '0.05',
		},
		id: '3',
	});
	calculator.setExpression({
		latex: 'd=\\frac{\\epsilon}{3}',
		id: '4',
	});
	calculator.setExpression({
		latex: 'L-\\epsilon<y<L+\\epsilon',
		color: '#388c46',
		fillOpacity: 0.15,
		id: '5',
	});
	calculator.setExpression({
		latex: 'c-d<x<c+d',
		color: '#c74440',
		fillOpacity: 0.15,
		id: '6',
	});
	calculator.setExpression({
		latex: '\\left(c,L\\right)',
		color: '#000000',
		pointSize: 14,
		label: '(c, L)',
		showLabel: true,
		id: '7',
	});
	calculator.setMathBounds({ left: 0.5, right: 3.5, bottom: -1.5, top: 3.5 });
</script>
</body>
</html>
