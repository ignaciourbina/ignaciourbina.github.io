<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The squeeze theorem</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #calculator { width: 100%; height: 100%; }
</style>
<script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
<div id="calculator"></div>
<script>
	var elt = document.getElementById("calculator");
	var calculator = Desmos.GraphingCalculator(elt);
	calculator.setExpression({
		latex: 'y=x^{2}\\sin\\left(\\frac{1}{x}\\right)',
		color: '#6042a6',
		lineWidth: 3,
		id: '0',
	});
	calculator.setExpression({
		latex: 'y=x^{2}',
		color: '#2d70b3',
		lineStyle: 'DASHED',
		id: '1',
	});
	calculator.setExpression({
		latex: 'y=-x^{2}',
		color: '#388c46',
		lineStyle: 'DASHED',
		id: '2',
	});
	calculator.setExpression({
		latex: '\\left(0,0\\right)',
		color: '#c74440',
		pointSize: 12,
		label: 'limit 0',
		showLabel: true,
		id: '3',
	});
	calculator.setMathBounds({ left: -0.6, right: 0.6, bottom: -0.36, top: 0.36 });
</script>
</body>
</html>
